name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run safety test suite
        run: python -m unittest discover -s tests -v

      - name: Install free build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install nsis --no-progress -y

      - name: Build standalone application
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name GoogleTakeoutOrganizer
          --add-data "assets/takeout-organizer-logo.png;assets"
          app.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
              (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
              (Join-Path $env:ChocolateyInstall 'bin\makensis.exe')
            )
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw 'NSIS compiler makensis.exe was not found after installation.' }
          Write-Host "Using NSIS compiler at $makensis"
          & $makensis /V4 "/DAPP_VERSION=$version" packaging\TakeoutOrganizer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test install, launch, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'GoogleTakeoutOrganizerSmoke'
          $installer = (Get-ChildItem dist\GoogleTakeoutOrganizer-Setup-*.exe | Select-Object -First 1).FullName
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)." }
          $app = Join-Path $installDir 'GoogleTakeoutOrganizer.exe'
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          if (-not (Test-Path $app) -or -not (Test-Path $uninstaller)) { throw 'Installer did not create the app and uninstaller.' }
          $appProcess = Start-Process -FilePath $app -PassThru
          try {
            if (-not $appProcess.WaitForInputIdle(15000)) { throw 'App did not reach its Windows message loop.' }
            Start-Sleep -Seconds 2
            if ($appProcess.HasExited) { throw 'App closed unexpectedly during startup.' }
          } finally {
            if (-not $appProcess.HasExited) {
              $null = $appProcess.CloseMainWindow()
              if (-not $appProcess.WaitForExit(5000)) { Stop-Process -Id $appProcess.Id -Force }
            }
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$installDir") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $app) { throw 'Uninstaller left the application executable behind.' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GoogleTakeoutOrganizer') { throw 'Uninstaller left its registry entry behind.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTakeoutOrganizer-Windows-Installer
          path: dist/GoogleTakeoutOrganizer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/GoogleTakeoutOrganizer-Setup-*.exe
