name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run safety test suite
        run: python -m unittest discover -s tests -v

      - name: Install free build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          choco install nsis --no-progress -y

      - name: Build standalone application
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name GoogleTakeoutOrganizer
          --add-data "assets/takeout-organizer-logo.png;assets"
          app.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DAPP_VERSION=$version" packaging\TakeoutOrganizer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTakeoutOrganizer-Windows-Installer
          path: dist/GoogleTakeoutOrganizer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/GoogleTakeoutOrganizer-Setup-*.exe
